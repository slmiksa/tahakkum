# Serves the dashboard directly with Nginx. Change the domain and the folder.
# For the HTTPS certificate: sudo certbot --nginx -d licenses.example.com
server {
    listen 80;
    server_name licenses.example.com;

    root /var/www/tahakkum-dashboard;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;

    location = /server.mjs { return 404; }
    location = /README.md { return 404; }
    location = /nginx-example.conf { return 404; }
    location ~ /\. { return 404; }
}
